[project]
name = "apodfetch"
version = "0.1.0"
description = "Display NASA Astronomy Picture of the Day in the terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joesackic", email = "joel.schutt0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
apodfetch = "apodfetch.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
